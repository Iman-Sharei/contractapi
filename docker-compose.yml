services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/examples/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./backend
    environment:
      STUDIO_API_KEY: ${STUDIO_API_KEY:-dev-studio-key-change-me}
      DATA_API_KEYS: ${DATA_API_KEYS:-dev-data-key}
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-change-me-please-32chars}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      REDIS_URL: redis://redis:6379/0
      JOB_QUEUE_ENABLED: ${JOB_QUEUE_ENABLED:-false}
      SPECS_DIR: /data/specs
      AUDIT_LOG_PATH: /data/logs/audit.jsonl
      DATAAPI_EXPERIMENTAL: ${DATAAPI_EXPERIMENTAL:-all}
    ports:
      - "8000:8000"
    volumes:
      - apidata:/data
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ./backend
    profiles: ["queue"]
    environment:
      REDIS_URL: redis://redis:6379/0
      JOB_QUEUE_ENABLED: "true"
      DATAAPI_EXPERIMENTAL: all
      SPECS_DIR: /data/specs
    volumes:
      - apidata:/data
    depends_on:
      redis:
        condition: service_healthy
    command: ["dataapi", "worker"]

  web:
    build:
      context: ./apps/web
      args:
        NEXT_PUBLIC_API_BASE: ${NEXT_PUBLIC_API_BASE:-http://localhost:8000}
    environment:
      API_BASE: http://api:8000
      STUDIO_API_KEY: ${STUDIO_API_KEY:-dev-studio-key-change-me}
      DATA_API_KEY: ${DATA_API_KEYS:-dev-data-key}
      NEXT_PUBLIC_API_BASE: ${NEXT_PUBLIC_API_BASE:-http://localhost:8000}
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  pgdata:
  apidata:

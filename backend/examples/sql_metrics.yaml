# Custom SQL metrics endpoint (read-only). Named param :min_total.
database:
  url: postgresql://postgres:postgres@localhost:5433/app

app:
  title: SQL Metrics Demo
  version: 0.3.0
  description: Aggregation via safe SELECT subquery.
  read_only: true
  auth: none
  api_prefix: /v1

endpoints:
  - name: order_totals
    path: /analytics/order-totals
    sql: |
      SELECT c.id,
             c.name,
             COUNT(o.id)::int AS order_count,
             COALESCE(SUM(o.total), 0)::float AS total_spent
      FROM customers c
      LEFT JOIN orders o ON o.customer_id = c.id
      GROUP BY c.id, c.name
      HAVING COALESCE(SUM(o.total), 0) >= :min_total
    sql_params:
      - name: min_total
        type: float
        required: false
        default: 0
        description: Minimum spent to include a customer
    primary_key: id
    fields: [id, name, order_count, total_spent]
    filters: [name]
    filter_operators: [eq, contains, search]
    search_param: q
    sortable: [id, total_spent, order_count]
    csv_export: true
    ndjson_export: true
    parquet_export: true
    pagination:
      mode: offset
      default_limit: 50
      max_limit: 200
    description: Per-customer order totals (SQL)

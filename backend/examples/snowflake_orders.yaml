# Snowflake warehouse driver (optional extra).
# pip install 'contractapi[snowflake]'
database:
  url: snowflake://USER:PASSWORD@ACCOUNT/DATABASE/SCHEMA?warehouse=COMPUTE_WH
  driver: snowflake

app:
  title: Snowflake Orders API
  version: 0.5.0
  description: Read-only contract over a Snowflake schema
  read_only: true
  auth: api_key
  api_prefix: ""

endpoints:
  - name: orders
    path: /orders
    table: ORDERS
    schema: PUBLIC
    methods: [GET]
    primary_key: ORDER_ID
    fields: [ORDER_ID, STATUS, AMOUNT]
    filters: [STATUS]
    sortable: [ORDER_ID]
    pagination:
      mode: offset
      default_limit: 50
      max_limit: 500
  # VARIANT / OBJECT / ARRAY columns are returned as real JSON (not JSON text).
  # They cannot be filters, sort fields or writable: activation says so if listed there.
  - name: events
    path: /events
    table: EVENTS
    schema: PUBLIC
    primary_key: EVENT_ID
    fields: [EVENT_ID, KIND, PAYLOAD]   # PAYLOAD is a VARIANT column
    filters: [KIND]
    sortable: [EVENT_ID]
    pagination: {mode: offset}
